<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LLM Translator Settings</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    label { display: block; margin: 10px 0 5px; }
    input[type="text"] { width: 100%; padding: 5px; box-sizing: border-box; }
    button { margin-top: 15px; padding: 10px 15px; }
    .status { margin-top: 10px; color: green; }
    .error { margin-top: 10px; color: red; }
  </style>
</head>
<body>
  <h1>LLM Translator Settings</h1>
  <form id="settings-form">
    <label for="targetLanguage">Target Language:</label>
    <input type="text" id="targetLanguage" name="targetLanguage" placeholder="For example, Russian" required>
    
    <label for="model">Gemini Model:</label>
    <input type="text" id="model" name="model" value="gemini-3.5-flash-lite" required>
    
    <label for="apiKey">API Key:</label>
    <input type="text" id="apiKey" name="apiKey" placeholder="Your API Key" required>
    
    <button type="submit">Save Settings</button>
  </form>
  <div id="message"></div>
  
  <script src="options.js"></script>
</body>
</html>
